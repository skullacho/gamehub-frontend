<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141729" />
      <stop offset="50%" stop-color="#1a1e38" />
      <stop offset="100%" stop-color="#0c0e18" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo do Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" stroke="#2b3252" stroke-width="2" />
  
  <!-- Padrão Geométrico de Fundo -->
  <g opacity="0.15">
    <circle cx="200" cy="220" r="140" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="200" cy="220" r="90" fill="none" stroke="#0070f3" stroke-width="1.5" />
    <line x1="60" y1="220" x2="340" y2="220" stroke="#4a5580" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="200" y1="80" x2="200" y2="360" stroke="#4a5580" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Brilho Neon Central -->
  <circle cx="200" cy="210" r="60" fill="url(#glowGrad)" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Ícone de Controle de Vídeo Game -->
  <g transform="translate(136, 150) scale(2.6)" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo do Controle -->
    <path d="M6 11c0-2.8 2.2-5 5-5h26c2.8 0 5 2.2 5 5v14c0 4-3.5 7-7.5 5.5l-6-2.5a4 4 0 0 0-3 0l-6 2.5C15.5 32 12 29 12 25v-1" />
    <!-- D-Pad (Cruz Direcional) -->
    <path d="M14 16h4M16 14v4" stroke-width="1.8" />
    <!-- Botões de Ação (A, B, X, Y) -->
    <circle cx="31" cy="14.5" r="1.2" fill="#0070f3" />
    <circle cx="34.5" cy="17" r="1.2" fill="#7928ca" />
    <circle cx="31" cy="19.5" r="1.2" fill="#00dfd8" />
    <circle cx="27.5" cy="17" r="1.2" fill="#ff0080" />
    <!-- Botões Centrais -->
    <line x1="22" y1="17" x2="24" y2="17" stroke="#687790" stroke-width="1.2" />
    <line x1="24" y1="17" x2="26" y2="17" stroke="#687790" stroke-width="1.2" />
  </g>

  <!-- Tipografia GameHub -->
  <text x="200" y="325" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f0f4fc" letter-spacing="3">GAMEHUB</text>
  <text x="200" y="355" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#8290b0" letter-spacing="1">IMAGEM INDISPONÍVEL</text>

  <!-- Tag de Borda Decorativa -->
  <rect x="140" y="390" width="120" height="26" rx="13" fill="#1e233d" stroke="#333d66" stroke-width="1" />
  <text x="200" y="407" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00dfd8" letter-spacing="0.5">CATÁLOGO</text>
</svg>
